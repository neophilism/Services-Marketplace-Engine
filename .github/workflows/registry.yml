name: Registry validation
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci
      - run: npm run validate:plan
      - run: npm run validate:static
  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci
      - run: npm run build
      - run: npm test
  database:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci
      - run: npm run migrate:up
      - run: bash database/test-migrations.sh
      - run: npm run migrate:down
      - name: Verify rollback
        run: test "$(psql "$DATABASE_URL" --tuples-only --no-align --command "SELECT to_regnamespace('marketplace') IS NULL")" = "t"
